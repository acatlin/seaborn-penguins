# Mastery objectives for the larger course this site belongs to, and the map from
# this site's pages, exercises, quizzes, exam and rubrics onto them.
#
# tools/build_objectives.py turns this file into instructor/Seaborn_Mastery_Objectives.xlsx
# (python tools/build_materials.py runs it). tests/test_objectives.py checks that every
# page section, exercise, quiz question, exam question and rubric row named here exists,
# and that none is left out.
#
# Three sections:
#   S01-S14  static visualization   (this site: Start here and Lessons 1-7)
#   I01-I12  interactive charts     (not written yet)
#   D01-D12  dashboards             (not written yet)
# S13 and S14 were split off S05 and S12 in version 1.3. A code is never reused, so they
# follow S12 in the list, although S13 is taught in Lesson 4.
#
# An objective's status (Covered, Partial, Planned) is not stored here. The workbook
# works it out from the page map and the evidence map below.

meta:
  title: "Mastery objectives"
  course: "Python visualization tools"
  version: "1.6"
  date: "2026-11-15"

sections:
  - key: S
    label: "1 Static"
    title: "Static visualization"
    tools: "seaborn 0.13 and matplotlib"
    content: "This site: Start here and Lessons 1-7."
  - key: I
    label: "2 Interactive"
    title: "Interactive charts"
    tools: "Plotly."
    content: "Not written yet."
  - key: D
    label: "3 Dashboards"
    title: "Dashboards"
    tools: "Streamlit."
    content: "Not written yet."

# ---------------------------------------------------------------- timing inputs
# Every number here appears on the Timing sheet as an input cell with its basis beside it.
timing:
  session_minutes: 75
  session_basis: "The instructor guide's first schedule: seven 75-minute sessions."
  check_minutes: {S: 35, I: 35, D: 35}
  check_basis: >-
    Section 1: the existing 25-question exam (instructor guide: allow about 35 minutes).
    Sections 2 and 3: assumed to end with a check of the same length.
  project_hours: {S: 7.0, I: 6, D: 9}
  project_basis: >-
    Section 1: Assignments 1-3 (about 1 h, about 2 h and 3-4 h; the midpoint is 6.5 h) and
    the short task 'Questions only' (about half an hour).
    Sections 2 and 3: planning estimates for one or two projects each.
  allowance: 0.15
  allowance_basis: >-
    Assumed. Time for correctives and a second check, as a share of lesson and check time.
    Revise it after the first run.
  lesson_basis: >-
    Section 1: the instructor guide gives 45-75 minutes per lesson. Each lesson is counted
    at the 60-minute midpoint and split across the objectives it serves (table below).
    Multiply by 0.75 or 1.25 for the ends of the range. Sections 2 and 3: planning
    estimates of 30-120 minutes per objective, by analogy with section 1 (30 minutes per
    objective on average), with more time where the tool brings a new mental model
    (figure objects, the rerun, session state) or the objective is a studio capstone.
    Section 3 is counted for Streamlit, in which a first app, a layout, the path from
    inputs to outputs and a deployment take less code than in a framework built on
    callbacks: D02, D03, D04, D06 and D11 are 10 to 15 minutes shorter for it.
  to_write_basis: >-
    Learner minutes that do not exist as pages yet. In section 1 these are the additions
    named in the 'Next step' column of the Objectives sheet.
  added_basis: >-
    Learner minutes of what was added to a lesson after it was timed. Each lesson stays at
    its 60-minute midpoint, and an addition is counted here from the day it is built.

# How each existing lesson's 60 minutes divide across the objectives (section 1 only).
lesson_minutes:
  01-first-plot: {S01: 30, S02: 15, S05: 15}
  02-distributions: {S03: 60}
  03-categories: {S04: 60}
  04-relationships: {S05: 35, S13: 25}
  05-small-multiples: {S06: 60}
  06-polish: {S07: 15, S08: 15, S10: 10, S11: 15, S12: 5}
  07-capstone: {S09: 10, S10: 35, S11: 15}

# Additions that are built (PLAN.md, question 2). A lesson keeps its 60 minutes above. What is
# added to it later is listed here, in a block of its own, and its minutes leave the
# objective's to_write. tests/test_objectives.py holds the two together at 65 minutes.
added_minutes:
  - {lesson: 06-polish, objective: S08, minutes: 10, what: "Exercise 6.3: annotate a point and format the tick labels."}
  - {lesson: 06-polish, objective: S11, minutes: 10, what: "Exercise 6.4: write down three problems with the 'before' chart of the makeover."}
  - {lesson: 07-capstone, objective: S09, minutes: 20, what: "Exercise 7.2: three questions, and the learner chooses the chart form for each."}
  - {lesson: 07-capstone, objective: S12, minutes: 10, what: "Step 5, 'Describe and deliver', and exercise 7.3: save a figure for its destination, open the file, rerun the notebook."}
  - {lesson: 07-capstone, objective: S14, minutes: 15, what: "Step 5, 'Describe and deliver', and exercise 7.3: write a figure's alt text and a caption with its caveat."}

# ---------------------------------------------------------------- read-me text
mastery_rule:
  - "An objective is mastered when (1) every exercise that checks it on the pages that teach it passes its automatic check, shown to the instructor or handed in as the lesson's notebook with its outputs, and (2) the learner scores 80% or better on a mastery check for that objective. The Objectives sheet names those exercises under 'Practice today'. An exercise on another page that also checks the objective is further practice, and mastery does not wait for it."
  - "A mastery check is five questions the learner has not seen with their answers, or a rubric-scored task at full credit on the rubric rows mapped to the objective. On the assessment pack's three-level scale, 'about half' means not yet."
  - "Not yet? The learner reworks the sections that teach the objective (Page detail sheet, filter on the objective), redoes its exercises from Reset, and takes a different check. There is no penalty for a second attempt."
  - "Mastered early? The learner moves to the next objective whose prerequisites are met, or starts the next assignment."
  - "With today's materials: no mastery check is written yet. Until one is, a learner moves on from an objective when its exercises under rule 1 pass, and the rubric rows of the next assignment confirm the objective or send the learner back to it. The exam has at most four questions per objective and its answer key is public, so use its questions to find what to rework, not to decide mastery."

assumptions:
  - "The larger course has three sections: static visualization (this site, fourteen objectives), interactive charts (twelve) and dashboards (twelve). This site is section 1 in full."
  - "Learners arrive with Python basics and pandas, the prerequisite stated on the Start here page. Those skills are not objectives here, which is why one rubric row (Assignment 2, 'Code quality') maps to none."
  - "The mastery standard is 80% on a check of five unseen questions, which is four of the five, or full credit on the mapped rubric rows, with a second attempt on a different check."
  - "Section 2 uses Plotly. Its objectives are worded so that another library would change the 'Key tools' column, not the objective, except I04 and I07, whose criteria name Plotly's own functions. Plotly links two views only inside a scatter matrix or through a notebook widget, so linking two separate charts (I08) is finished in section 3 (D07). Altair, the alternative that was weighed, links them in a few lines. Section 3 uses Streamlit and is written in its terms (the rerun, session state, caching), so the alternative, Dash, would mean rewriting D02 to D09 and D11. The names in 'Key tools' were checked against the documentation of Plotly 7.1 and Streamlit 1.67."
  - "An exercise counts as evidence for an objective only when its automatic check tests that objective. S01 is counted in Lesson 1's two exercises alone: later checks also look at which columns are plotted, but to recognize the chart, not to test the mapping. Every quiz question and every exam question is mapped to exactly one objective. A rubric row is mapped to the objectives its 'full credit' text describes."
  - "Status: Covered means the pages teach the objective, at least one checked exercise practices it, and at least one exam question or rubric row assesses it. Partial means it is taught but practice or assessment is missing. Planned means no page teaches it yet."
  - "The lesson minutes are estimates (see the Timing sheet). Section 1 splits each existing lesson's 60-minute midpoint across its objectives, and counts what was added to a lesson later on top of it, in a block of its own. Sections 2 and 3 are planning figures to revise after a pilot."

strands:
  Question: "Decide what to show, and whether to show it at all."
  Build: "Turn data into the right chart or component."
  Interact: "Let the reader act on the chart: hover, navigate, filter, select."
  Compose: "Make several views read as one."
  Refine: "Words, color, polish and critique."
  Deliver: "Files, speed, robustness and hand-over."

shown_by:
  "Checked code + questions": "Code verified automatically (an in-page check or tests) plus a short set of questions."
  "Rubric task": "A product or a piece of writing scored with rubric rows."
  "Project": "A larger build scored with a rubric and a rationale."

# ---------------------------------------------------------------- objectives
# can:       completes the sentence "The learner can ..."
# criteria:  what mastery looks like, as things an instructor can see
# outcome:   the learning outcome (1-6) in the instructor guide that the objective refines
# to_write:  learner minutes that the next step would add (existing minutes are in lesson_minutes)
objectives:
  - id: S01
    name: "Map columns to visual channels"
    strand: Build
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Given a tidy DataFrame and a question, write one seaborn call that maps named columns to position, color, marker shape and size, and say what each mapping lets the reader compare."
    criteria:
      - "Passes the DataFrame once with data= and names its columns for x, y and hue."
      - "Adds style= or size= only when the question needs it."
      - "Explains tidy data: one row per observation, one column per variable."
      - "Tells hue= (a column) from color= (one fixed color)."
    prerequisites: []
    tools: "seaborn: scatterplot; data=, x=, y=, hue=, style=, size=, hue_order="
    outcome: 1
    to_write: 0
    gap: "The pages never say how color= differs from hue=. Lesson 1 uses color=\"gray\" once without comment, and the difference is spelled out only in the instructor guide's Lesson 1 notes and in the explanation of exam Q1."
    next_step: "Extension: start one example from a wide table and reshape it with pandas melt before plotting. Every example today arrives tidy."

  - id: S02
    name: "Label and title in plain language"
    strand: Refine
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Finish any seaborn chart through the object it returns, so that every axis label, legend title and chart title reads as plain English."
    criteria:
      - "Axis labels are plain English with units, not raw column names."
      - "The legend title is rewritten from the column name."
      - "The title states the finding instead of naming the axes."
      - "Uses ax.set(...) and ax.get_legend().set_title(...) on an Axes."
    prerequisites: [S01]
    tools: "matplotlib Axes: ax.set, ax.get_legend().set_title"
    outcome: 5
    to_write: 0
    gap: "One exam question (Q4). The exercise checks measure a title's length or look for one word in it, so 'states the finding' is judged by the assignment rubrics alone."
    next_step: "Write check questions that ask which of four titles states a finding."

  - id: S03
    name: "Show and compare distributions"
    strand: Build
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Given one numeric variable and a grouping variable, draw the distribution as a histogram, a density curve or an ECDF, set the bin width or smoothing on purpose, and say what the shape shows."
    criteria:
      - "Chooses a bin width (or bandwidth) on purpose and can defend it."
      - "Compares groups on a common baseline: overlaid step outlines or shared-axis panels, not stacked bars or blended fills."
      - "Handles the density curve's hidden choices: common_norm, bw_adjust and cut."
      - "Reads an ECDF to answer 'what share is at or below X?' and confirms it with pandas."
    prerequisites: [S01, S02]
    tools: "seaborn: histplot (binwidth=, binrange=, element=\"step\", fill=False), kdeplot (common_norm=, bw_adjust=, cut=), ecdfplot"
    outcome: 3
    to_write: 0
    gap: "Exercise 2.2 cannot check the share the learner prints (REVIEW.md, L15)."
    next_step: ""

  - id: S04
    name: "Compare categories honestly"
    strand: Build
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Given a question about groups, build a count, summary or per-group distribution chart whose ranking reads at a glance and whose scale does not distort the comparison."
    criteria:
      - "Bars start at zero, are sorted by value with order=, and run horizontally when labels are long."
      - "Says what the error bars show (errorbar=), or turns them off."
      - "Uses points instead of bars when zero is not meaningful, with no lines between unordered categories."
      - "Shows the spread with a box, violin or strip plot (or a box with the points on top) when a mean would hide it."
    prerequisites: [S01, S02]
    tools: "seaborn: countplot, barplot (order=, errorbar=), boxplot, violinplot, stripplot, pointplot (linestyle=\"none\")"
    outcome: 3
    to_write: 0
    gap: ""
    next_step: ""

  - id: S05
    name: "Show a trend and check for hidden groups"
    strand: Build
    bloom: Analyze
    shown_by: "Checked code + questions"
    can: "Given two numeric variables, show how they move together with a fitted trend, or with a line chart when x is ordered, and check whether a grouping variable changes the story."
    criteria:
      - "Looks at the points before trusting a straight line: a fitted line is a model, not the data."
      - "Fits a trend overall and per group (regplot, lmplot with hue, or a groupby loop) and reports any reversal between the pooled and the within-group trend (Simpson's paradox)."
      - "Describes the shaded band as uncertainty about the line, not the spread of individuals."
      - "Connects points with a line only when x is ordered."
    prerequisites: [S01, S02]
    tools: "seaborn: scatterplot with hue=, regplot, lmplot, lineplot (errorbar=)"
    outcome: 3
    to_write: 0
    gap: "No rubric row: no assignment asks for a fitted trend or a line chart."
    next_step: ""

  - id: S06
    name: "Build small multiples"
    strand: Compose
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Split a crowded chart into a grid of panels on shared axes with a figure-level function, then size, order and label the grid."
    criteria:
      - "Picks a figure-level function (relplot, displot, catplot, lmplot) when the layout is a grid of one chart type, and an axes-level one otherwise."
      - "Facets with col=, row= and col_wrap=, and orders the panels on purpose (col_order=)."
      - "Sizes the grid with height= and aspect=, not figsize."
      - "Labels through the grid: set_axis_labels, set_titles(\"{col_name}\"), g.legend.set_title, g.figure.suptitle."
      - "Keeps the axes shared, or says why not."
    prerequisites: [S01, S02]
    tools: "seaborn: relplot, displot, catplot, lmplot, FacetGrid; col=, row=, col_wrap=, col_order=, height=, aspect="
    outcome: 4
    to_write: 0
    gap: ""
    next_step: ""

  - id: S07
    name: "Use color with purpose"
    strand: Refine
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Choose and apply colors so that each color means one thing, means it on every chart, and suits the kind of data it encodes."
    criteria:
      - "Pins each category to a color with a dict palette, reused on every chart; a second variable never borrows those colors."
      - "Matches the palette type to the data: categorical for identity, sequential for amount, diverging for a meaningful midpoint."
      - "Avoids rainbow palettes and does not rely on color alone: shape, position or a label carries the distinction too."
      - "Uses gray for context and one strong color for the group the chart is about."
    prerequisites: [S01]
    tools: "seaborn: palette= with a dict, color_palette(\"colorblind\"), \"crest\", \"vlag\"; the course's PENGUIN_COLORS and SEX_COLORS"
    outcome: 6
    to_write: 0
    gap: "Learners are told that PENGUIN_COLORS is safe for color-blind readers. They never test a palette themselves."
    next_step: "Extension: have learners check a palette of their own with a color-vision simulator."

  - id: S08
    name: "Polish a chart with matplotlib"
    strand: Refine
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Use matplotlib on the Axes that seaborn returns to remove ink that is not data and to point the reader at what matters."
    criteria:
      - "Sets a quiet theme with sns.set_theme, and scopes a temporary style so that it does not leak into later charts."
      - "Removes non-data ink: sns.despine() and no redundant legend."
      - "Labels groups directly with ax.text where a legend would make the reader look away."
      - "Annotates the one point worth noticing (ax.annotate) and adds reference lines (ax.axvline, ax.axhline)."
      - "Formats tick labels in the units people think in."
    prerequisites: [S02]
    tools: "seaborn: set_theme, axes_style, despine; matplotlib: ax.text, ax.annotate, ax.axvline, ax.axhline, axis.set_major_formatter"
    outcome: 5
    to_write: 0
    gap: "ax.axhline is named in Lesson 6's takeaways but never shown."
    next_step: ""

  - id: S09
    name: "Choose the chart form from the question"
    strand: Question
    bloom: Evaluate
    shown_by: "Rubric task"
    can: "Given a question and a dataset, name the data's job (a distribution, a comparison across groups or a relationship) and choose a chart form that answers it, ruling out forms that would mislead."
    criteria:
      - "Names the question each chart answers before drawing it."
      - "Matches the job to a form, as in the table in Lesson 7, Step 1."
      - "Rules out a misleading form and says why: a pie or stacked bars for a comparison, a line across unordered categories, bars where zero means nothing."
      - "Cuts any panel whose question cannot be named."
    prerequisites: [S03, S04, S05]
    tools: "No new functions: the chart forms from S03, S04 and S05"
    outcome: 2
    to_write: 0
    gap: "No exam question. Exercise 7.2 judges the form of three charts and cannot read a reason, so the reasons for a choice are scored in the short task 'Questions only' alone. Assignments 1 to 3 name their chart types."
    next_step: "For the mastery check: a second set of three questions for the task, and check questions of the 'which chart answers this?' kind (quiz L3 Q3 and L7 Q3 are models)."

  - id: S10
    name: "Compose a multi-panel figure"
    strand: Compose
    bloom: Create
    shown_by: "Project"
    can: "Build a figure of several different charts with plt.subplots and axes-level functions that reads as one piece: one layout, one legend, one title and one color story."
    criteria:
      - "Creates the grid with plt.subplots(..., layout=\"constrained\") and draws each panel by passing ax= to an axes-level function."
      - "Indexes or loops over the array of Axes correctly."
      - "Uses one figure-level legend or direct labels instead of a legend in every panel."
      - "Gives the figure a suptitle and every panel a title that states its finding."
      - "Keeps categories in the same order and the same colors in every panel (order=, hue_order=)."
    prerequisites: [S03, S04, S07, S08]
    tools: "matplotlib: plt.subplots, layout=\"constrained\", fig.legend, fig.suptitle; seaborn: ax=, order=, hue_order=, despine(fig=fig)"
    outcome: 4
    to_write: 0
    gap: ""
    next_step: ""

  - id: S11
    name: "Critique and redesign a chart"
    strand: Refine
    bloom: Evaluate
    shown_by: "Rubric task"
    can: "Given a chart that works but says nothing, name what is wrong with it against the pre-flight checklist, rebuild it, and justify each change with the design principle behind it."
    criteria:
      - "Checks question, form, honesty, color, ink and words, in that order."
      - "Removes encodings that do not serve the question."
      - "Replaces lookups (a legend, raw column names) with direct labels and plain words."
      - "Ties each change to a named principle (data-ink, common baseline, highlighting, direct labels, honest scales, consistent color) rather than listing buzzwords."
    prerequisites: [S07, S08, S09]
    tools: "The pre-flight checklist in Lesson 7 and the table 'Stephen Few's checklist, applied' in Lesson 6"
    outcome: 6
    to_write: 0
    gap: "Exercise 6.4 asks for a critique in the learner's own words, but its check can only count the statements, and exercise 6.1 lists the fixes for the learner. The first critique that anyone judges comes in Assignment 3. No exam question."
    next_step: "S09, a prerequisite, is taught in Lesson 7, after the makeover, so S11's mastery check belongs after Lesson 7. A peer review against the pre-flight checklist would give the critique of exercise 6.4 a reader."

  - id: S12
    name: "Save a figure that can be reproduced"
    strand: Deliver
    bloom: Apply
    shown_by: "Rubric task"
    can: "Hand over a finished figure as files: saved at publication quality, in the format its destination needs, from a notebook that runs top to bottom."
    criteria:
      - "Saves with fig.savefig (or g.savefig) as a PNG at 200 dpi or more, with nothing cut off (bbox_inches=\"tight\" or a constrained layout)."
      - "Picks the format for the destination: a PNG for slides and documents, a vector file such as SVG where the figure must stay sharp at any size."
      - "A restart-and-run-all of the notebook reproduces every figure."
    prerequisites: [S02]
    tools: "matplotlib: fig.savefig (dpi=, bbox_inches=\"tight\"), g.savefig, PNG and SVG; Jupyter: restart and run all"
    outcome: 5
    to_write: 0
    gap: "Exercise 7.3 opens the file the learner saved and reads its format and resolution. Two things in Step 5 are done outside the page, and nothing checks them: looking at the file at the size it will be shown, and restarting the notebook to run it top to bottom, which only the assignments ask for. No exam question."
    next_step: ""

  # S13 and S14 were split off S05 and S12 in version 1.3 (REVIEW.md, O8).
  - id: S13
    name: "Show correlations among several variables"
    strand: Build
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Given three or more numeric variables, summarize how each pair moves together in a correlation heatmap that reads at a glance, and scan every pair with a pair plot before choosing what to present."
    criteria:
      - "Draws a correlation heatmap on a diverging scale centered on zero, with limits fixed at -1 and 1 and the values printed."
      - "Checks whether a correlation holds within groups before reporting it: a pooled value can hide or reverse what each group shows."
      - "Uses a pair plot to explore, not to present."
    prerequisites: [S01, S02, S05]
    tools: "pandas: select_dtypes(\"number\").corr(); seaborn: heatmap (cmap=\"vlag\", center=0, vmin=-1, vmax=1, annot=True, mask=), pairplot (corner=True)"
    outcome: 3
    to_write: 0
    gap: "The slice and the mask that show each pair once are taught in Lesson 4, but exercise 4.1 does not ask for them."
    next_step: ""

  - id: S14
    name: "Describe what a figure shows"
    strand: Deliver
    bloom: Analyze
    shown_by: "Rubric task"
    can: "Write the words that let a figure stand on its own: one or two plain sentences that say what it shows, with the caveats that change how it should be read."
    criteria:
      - "One or two accurate sentences (a caption or alt text) tell a general reader what the chart shows."
      - "Each claim points at something the reader can check in the chart: a panel, a group or a value."
      - "States caveats that change the reading, such as rows left out or groups too small to trust."
    prerequisites: [S02]
    tools: "No functions: a caption, alt text, a short written verdict"
    outcome: 5
    to_write: 0
    gap: "Exercise 7.3 counts the words of the alt text and the caption, and rejects a repeat of the title. Whether they are true, and whether the caveat matters, is judged by the rubric rows alone. Taught in Lesson 7, after Assignments 1 and 2 have already asked for a written reading. No exam question."
    next_step: "Consider a sentence on reading a chart aloud in Lesson 3, before Assignment 1 asks for one."

  - id: I01
    name: "Decide when interaction earns its place"
    strand: Question
    bloom: Evaluate
    shown_by: "Rubric task"
    can: "Given a chart and what its readers need to do with it, decide whether interaction would help and which kind: an overview first, then zoom and filter, then details on demand."
    criteria:
      - "Names the reader's task that a static chart or small multiples cannot serve."
      - "Matches the interaction to the task: hover for exact values, zoom for dense regions, filter for subsets, selection for linking views."
      - "Keeps the chart static when the reader needs one message, as on a slide or in print."
    prerequisites: [S09]
    tools: "No code: a decision. Examples in Plotly"
    outcome: null
    to_write: 30
    gap: "Not written yet."
    next_step: "Open section 2 here. Lesson 7, 'Where to next?', already names the condition: 'when readers need to hover, zoom or filter'."

  - id: I02
    name: "Build an interactive chart from tidy data"
    strand: Build
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Rebuild a static chart as an interactive one with a high-level API, mapping the same columns to the same channels."
    criteria:
      - "One call maps columns to x, y, color, symbol, size and facets."
      - "Reuses the course's fixed colors and category order, so a species looks the same as in section 1."
      - "Axis and legend labels are plain English with units, and the title states the finding."
      - "Covers all three jobs: a distribution, a comparison and a relationship."
    prerequisites: [S01, S02, S07]
    tools: "Plotly Express: px.scatter, px.histogram, px.bar, px.box; color=, symbol=, facet_col=, color_discrete_map=, category_orders=, labels="
    outcome: null
    to_write: 60
    gap: "Not written yet."
    next_step: "The grammar carries over almost word for word (hue= becomes color=, style= becomes symbol=, col= becomes facet_col=), so teach it as a translation table."

  - id: I03
    name: "Design tooltips that give details on demand"
    strand: Interact
    bloom: Apply
    shown_by: "Checked code + questions"
    can: "Write the hover text for a chart so that it says what one mark is and what it measures, in plain words and with sensible precision."
    criteria:
      - "The tooltip names the thing (for example the species and island) and shows only the fields that help."
      - "Numbers carry units and are rounded, and no raw column name appears."
      - "Uses one shared tooltip along x where the reader compares several series at one x value."
      - "Nothing the reader must know appears only in a tooltip."
    prerequisites: [I02]
    tools: "Plotly: hover_name=, hover_data=, hovertemplate, hovermode=\"x unified\""
    outcome: null
    to_write: 40
    gap: "Not written yet."
    next_step: ""

  - id: I04
    name: "Edit the figure object"
